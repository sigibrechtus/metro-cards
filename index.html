<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0077b6">
<title>Cartes Métro</title>
<style>
  :root[data-theme="light"]{
    --bg1:#eef4ff; --bg2:#e6f7f3;
    --card-bg:#ffffff; --text:#1a1a2e; --text2:#6b7280;
    --accent:#0077b6; --accent2:#00b4a6;
    --border:#e5e7eb; --shadow:rgba(0,0,0,0.08);
    --panel-bg:#ffffff; --minus-grad1:#0077b6; --minus-grad2:#0096c7;
    --danger:#ef4444;
  }
  :root[data-theme="dark"]{
    --bg1:#0f172a; --bg2:#1e293b;
    --card-bg:#1e293b; --text:#f1f5f9; --text2:#94a3b8;
    --accent:#38bdf8; --accent2:#2dd4bf;
    --border:#334155; --shadow:rgba(0,0,0,0.4);
    --panel-bg:#1e293b; --minus-grad1:#0369a1; --minus-grad2:#0284c7;
    --danger:#f87171;
  }
  *{box-sizing:border-box;}
  html, body {
    margin:0; height:100dvh; height:-webkit-fill-available; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text); -webkit-tap-highlight-color:transparent; transition:background .3s;
  }
  #app{ height:100dvh; display:flex; flex-direction:column; }
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 20px) + 14px) 20px 14px 20px; flex-shrink:0;
  }
  .app-header h1{ font-size:1.3rem; margin:0; font-weight:700; }
  .icon-btn{
    position:relative; background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
    width:42px; height:42px; font-size:1.2rem; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .menu-badge{
    position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%;
    background:var(--danger); border:2px solid var(--bg1); display:none;
  }
  .menu-badge.show{ display:block; }
  .grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px;
    padding:0 16px calc(env(safe-area-inset-bottom, 16px) + 16px) 16px;
    overflow-y:auto; overflow-x:hidden; align-content:start; -webkit-overflow-scrolling:touch;
  }
  .card{
    position:relative; background:var(--card-bg); border-radius:22px; padding:16px;
    box-shadow:0 8px 20px var(--shadow);
    border-left:6px solid var(--card-color, var(--accent));
    display:flex; flex-direction:column; justify-content:space-between;
    min-height:150px; user-select:none; transition:transform .28s ease, box-shadow .25s;
    animation:cardPop .28s ease;
  }
  .card.swiping{ transition:none; }
  .card.low{ box-shadow:0 0 0 2px var(--danger), 0 8px 20px var(--shadow); }
  @keyframes cardPop{ from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .card-header{ display:flex; align-items:center; gap:4px; }
  .card-color-dot{ width:10px; height:10px; border-radius:50%; background:var(--card-color, var(--accent)); flex-shrink:0; }
  .card-name{ font-weight:700; font-size:1rem; flex:1; }
  .warn-badge{ font-size:.9rem; }
  .card-rides{ text-align:center; }
  .rides-count{ font-size:2.4rem; font-weight:800; color:var(--accent); display:inline-block; line-height:1; }
  .card.low .rides-count{ color:var(--danger); }
  .rides-count.pulse{ animation:pulse .3s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.28);} 100%{transform:scale(1);} }
  .rides-label{ font-size:.75rem; color:var(--text2); display:block; }
  .card-actions{ display:flex; gap:6px; margin-top:8px; }
  .card-actions button{ border:none; border-radius:12px; font-weight:700; cursor:pointer; padding:10px 0; transition:transform .1s; }
  .card-actions button:active{ transform:scale(0.93); }
  .btn-minus{ flex:1.5; font-size:1.4rem; color:#fff; background:linear-gradient(135deg,var(--minus-grad1),var(--minus-grad2)); }
  .btn-reload{ flex:1; font-size:1.1rem; color:var(--accent2); background:color-mix(in srgb, var(--accent2) 15%, transparent); border:2px solid var(--accent2); }
  .btn-plus{ flex:0.8; font-size:1rem; color:var(--text2); background:transparent; border:1px solid var(--border); }
  .swipe-hint{ position:absolute; top:0; bottom:0; width:60px; display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; font-weight:800; color:#fff; opacity:0; pointer-events:none; border-radius:22px; z-index:-1; }
  .swipe-hint.left{ left:0; background:var(--minus-grad1); }
  .swipe-hint.right{ right:0; background:var(--accent2); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; }
  .overlay.active{ opacity:1; pointer-events:auto; }
  .panel{
    margin-left:auto; width:80%; max-width:320px; height:100%; background:var(--panel-bg);
    padding:calc(env(safe-area-inset-top, 20px) + 20px) 18px 28px 18px;
    transform:translateX(100%); transition:transform .25s; display:flex; flex-direction:column; gap:20px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .overlay.active .panel{ transform:translateX(0); }
  .panel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .panel-header h2{ margin:0; font-size:1.1rem; }
  .menu-item{ text-align:left; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:.95rem; cursor:pointer; }
  .account-area{display:flex;flex-direction:column;gap:10px}.account-status{font-size:.82rem;color:var(--text2);word-break:break-word}.account-buttons{display:flex;gap:8px}.account-buttons button{flex:1}.sync-status{font-size:.8rem;color:var(--text2);min-height:1em}.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.auth-overlay.active{display:flex}.auth-card{width:100%;max-width:380px;background:var(--card-bg);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}.auth-card h2{margin:0}.auth-card p{margin:0;color:var(--text2);font-size:.9rem}.auth-card label{font-size:.85rem;color:var(--text2);display:flex;flex-direction:column;gap:6px}.auth-card input{padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:1rem}.auth-card .checkbox-label{display:flex;flex-direction:row;align-items:center;gap:8px}.auth-error{color:var(--danger);font-size:.85rem;min-height:1em}
  .switch-row{ display:flex; justify-content:space-between; align-items:center; font-size:.95rem; padding:16px; border-radius:12px; border:1px solid var(--border); }

  .modal{
    margin:auto; width:88%; max-width:360px; max-height:80vh; overflow-y:auto;
    background:var(--card-bg); border-radius:20px; padding:22px;
    display:flex; flex-direction:column; gap:14px;
    transform:scale(.92); opacity:0; transition:transform .25s, opacity .25s;
  }
  .overlay.active .modal{ transform:scale(1); opacity:1; }
  .modal h2{ margin:0; font-size:1.15rem; }
  .modal p{ margin:0; color:var(--text2); font-size:.9rem; }
  .modal label{ font-size:.85rem; color:var(--text2); display:flex; flex-direction:column; gap:6px; }
  .modal input[type=text], .modal input[type=number]{
    padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:1rem;
  }
  .checkbox-label{ flex-direction:row !important; align-items:center; gap:8px !important; }
  .chip-row{ display:flex; gap:8px; }
  .chip{ flex:1; padding:8px 0; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); font-weight:600; }
  .preset-row{ display:flex; gap:8px; }
  .preset-row input{ flex:1; }
  .color-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .color-swatch{ width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .color-swatch.selected{ border-color:var(--text); }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .btn-primary{ background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-weight:700; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:10px; }
  .btn-danger{ background:transparent; border:1px solid var(--danger); color:var(--danger); padding:10px 18px; border-radius:10px; font-weight:600; }
  .close-modal{ background:none; border:none; font-size:1.1rem; color:var(--text2); cursor:pointer; }
  .manage-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:.9rem; }
  .manage-actions button{ background:none; border:none; font-size:1rem; margin-left:8px; cursor:pointer; }
  .stats-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:.9rem; }
  .stats-row span.name{ font-weight:700; }

  @media (orientation: landscape) {
    .grid{ grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); padding-bottom:calc(env(safe-area-inset-bottom, 8px) + 8px); }
    .card{ min-height:125px; padding:10px 14px; }
    .rides-count{ font-size:1.8rem; }
    .app-header{ padding-top:calc(env(safe-area-inset-top, 10px) + 8px); padding-bottom:8px; }
  }
</style>
</head>
<body data-theme="light">
<div id="app">
  <div class="app-header">
    <h1>🚇 Cartes Métro Paris</h1>
    <button id="menuBtn" class="icon-btn">☰<span class="menu-badge" id="menuBadge"></span></button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="panel">
    <div class="panel-header"><h2>Menu</h2><button class="close-modal" id="closeMenuBtn">✕</button></div>
    <div class="account-area"><div class="account-status" id="accountStatus">Non connecté — données enregistrées sur cet appareil.</div><div class="account-buttons"><button class="menu-item" id="signInBtn">Connexion / compte</button><button class="menu-item" id="signOutBtn" hidden>Déconnexion</button></div><div class="sync-status" id="syncStatus"></div></div>
    <div class="switch-row"><span>Mode sombre</span><input type="checkbox" id="themeToggle"></div>
    <button class="menu-item" id="addCardBtn">＋ Ajouter une carte</button>
    <button class="menu-item" id="manageCardsBtn">✎ Gérer les cartes</button>
    <button class="menu-item" id="statsBtn">📊 Statistiques</button>
    <button class="menu-item" id="exportBtn">⬇️ Exporter les données</button>
    <button class="menu-item" id="importBtn">⬆️ Importer les données</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="menu-item" id="resetCardsBtn">↺ Réinitialiser (4 cartes par défaut)</button>
  </div>
</div>

<div class="overlay" id="manageModal">
  <div class="modal">
    <div class="panel-header"><h2>Gérer les cartes</h2><button class="close-modal">✕</button></div>
    <div id="manageList"></div>
  </div>
</div>

<div class="overlay" id="statsModal">
  <div class="modal">
    <div class="panel-header"><h2>Statistiques</h2><button class="close-modal">✕</button></div>
    <div id="statsList"></div>
  </div>
</div>

<div class="overlay" id="editModal">
  <div class="modal">
    <h2>Modifier la carte</h2>
    <label>Nom<input id="editNameInput" type="text" maxlength="18"></label>
    <label>Tickets restants<input id="editRidesInput" type="number" min="0"></label>
    <label>Couleur
      <div class="color-row" id="colorRow"></div>
    </label>
    <label>Préréglages de rechargement
      <div class="preset-row">
        <input id="preset1Input" type="number" min="1" placeholder="10">
        <input id="preset2Input" type="number" min="1" placeholder="20">
        <input id="preset3Input" type="number" min="1" placeholder="30">
      </div>
    </label>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteCardBtn">Supprimer</button>
      <button class="btn-primary" id="saveCardBtn">Enregistrer</button>
    </div>
  </div>
</div>

<div class="overlay" id="reloadModal">
  <div class="modal">
    <h2 id="reloadTitle">Recharger</h2>
    <p id="reloadCurrent"></p>
    <div class="chip-row" id="chipRow"></div>
    <label>Quantité<input id="reloadInput" type="number" min="1" value="10"></label>
    <label class="checkbox-label"><input type="checkbox" id="replaceToggle"> Définir comme solde exact</label>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelReloadBtn">Annuler</button>
      <button class="btn-primary" id="confirmReloadBtn">Valider</button>
    </div>
  </div>
</div>

<div class="auth-overlay" id="authOverlay"><form class="auth-card" id="authForm"><h2>Compte Metro Cards</h2><p>Créez un compte ou connectez-vous pour synchroniser vos cartes entre appareils.</p><label>Adresse e-mail<input id="authEmail" type="email" autocomplete="email" required></label><label>Mot de passe<input id="authPassword" type="password" autocomplete="current-password" minlength="8" required></label><label class="checkbox-label"><input id="rememberLogin" type="checkbox"> Rester connecté sur cet appareil</label><div class="auth-error" id="authError"></div><div class="modal-actions"><button type="button" class="btn-secondary" id="cancelAuthBtn">Annuler</button><button type="submit" class="btn-primary" id="authSubmitBtn">Connexion</button></div><button type="button" class="menu-item" id="createAccountBtn">Créer un compte</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const STORAGE_KEY='metroCardsAppData';
const SUPABASE_URL=window.METRO_SUPABASE_URL||'';
const SUPABASE_PUBLISHABLE_KEY=window.METRO_SUPABASE_PUBLISHABLE_KEY||'';
const supabaseClient=(SUPABASE_URL&&SUPABASE_PUBLISHABLE_KEY&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let cloudUser=null,cloudReady=false,saveTimer=null,isApplyingCloud=false;
const uid=()=>'c'+Date.now()+Math.random().toString(36).slice(2,8);
const CARD_COLORS=['#0077b6','#00b4a6','#f77f00','#7209b7','#2a9d8f','#e63946','#ffb703','#457b9d'];
const LOW_THRESHOLD=3;

function hapticTap(){ if('vibrate' in navigator){ try{ navigator.vibrate(10); }catch(e){} } }

const DEFAULT_CARDS=()=>[
  {id:uid(),name:'Caro',rides:10,color:CARD_COLORS[0],presets:[10,20,30],log:[]},
  {id:uid(),name:'Sieb',rides:10,color:CARD_COLORS[1],presets:[10,20,30],log:[]},
  {id:uid(),name:'Chloé',rides:10,color:CARD_COLORS[2],presets:[10,20,30],log:[]},
  {id:uid(),name:'Elise',rides:10,color:CARD_COLORS[3],presets:[10,20,30],log:[]},
];

function ensureCardDefaults(card, idx){
  if(!card.color) card.color = CARD_COLORS[idx % CARD_COLORS.length];
  if(!Array.isArray(card.presets) || card.presets.length<3) card.presets=[10,20,30];
  if(!Array.isArray(card.log)) card.log=[];
  if(typeof card.rides!=='number') card.rides=0;
  return card;
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && Array.isArray(p.cards)){
        p.cards = p.cards.map((c,i)=>ensureCardDefaults(c,i));
        if(!p.theme) p.theme='light';
        return p;
      }
    }
  }catch(e){}
  return {theme:'light', cards:DEFAULT_CARDS()};
}
let state=loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); if(cloudUser&&cloudReady&&!isApplyingCloud) scheduleCloudSave(); }

const accountStatus=document.getElementById('accountStatus');
const syncStatus=document.getElementById('syncStatus');
const signInBtn=document.getElementById('signInBtn'),signOutBtn=document.getElementById('signOutBtn');
const authOverlay=document.getElementById('authOverlay'),authForm=document.getElementById('authForm');
const authEmail=document.getElementById('authEmail'),authPassword=document.getElementById('authPassword');
const rememberLogin=document.getElementById('rememberLogin'),authError=document.getElementById('authError');
const authSubmitBtn=document.getElementById('authSubmitBtn'),createAccountBtn=document.getElementById('createAccountBtn');
function updateAccountUi(){accountStatus.textContent=cloudUser?'Connecté : '+cloudUser.email:'Non connecté — données enregistrées sur cet appareil.';signInBtn.hidden=!!cloudUser;signOutBtn.hidden=!cloudUser;if(!supabaseClient)syncStatus.textContent='Configurez Supabase (voir README.md).';}
function showAuth(){authError.textContent='';authForm.reset();rememberLogin.checked=localStorage.getItem('metroRememberLogin')==='true';authSubmitBtn.textContent='Connexion';authSubmitBtn.dataset.mode='signin';createAccountBtn.hidden=false;authOverlay.classList.add('active');}
function closeAuth(){authOverlay.classList.remove('active');}
function setAuthMode(create){authSubmitBtn.dataset.mode=create?'signup':'signin';authSubmitBtn.textContent=create?'Créer le compte':'Connexion';createAccountBtn.hidden=create;authError.textContent='';}
function scheduleCloudSave(){clearTimeout(saveTimer);syncStatus.textContent='Modifications en attente…';saveTimer=setTimeout(saveCardsToCloud,700);}
async function saveCardsToCloud(){
 if(!supabaseClient||!cloudUser||!cloudReady)return;
 const rows=state.cards.map((c,position)=>({id:c.id,user_id:cloudUser.id,name:c.name,rides:c.rides,color:c.color,presets:c.presets,log:c.log,position}));
 const {data:existing,error:readError}=await supabaseClient.from('metro_cards').select('id').eq('user_id',cloudUser.id);
 if(readError){syncStatus.textContent='Échec de synchronisation. Données locales conservées.';return;}
 const keep=new Set(state.cards.map(c=>c.id)),removed=(existing||[]).map(r=>r.id).filter(id=>!keep.has(id));
 if(removed.length){const {error}=await supabaseClient.from('metro_cards').delete().in('id',removed);if(error){syncStatus.textContent='Échec de suppression synchronisée.';return;}}
 if(rows.length){const {error}=await supabaseClient.from('metro_cards').upsert(rows,{onConflict:'id'});if(error){syncStatus.textContent='Échec de synchronisation. Données locales conservées.';return;}}
 syncStatus.textContent='Synchronisé';
}
async function loadCardsFromCloud(user){
 cloudUser=user;cloudReady=false;updateAccountUi();if(!supabaseClient||!user)return;syncStatus.textContent='Chargement des cartes…';
 const {data,error}=await supabaseClient.from('metro_cards').select('id,name,rides,color,presets,log,position').eq('user_id',user.id).order('position');
 if(error){syncStatus.textContent='Impossible de charger les cartes.';return;}
 if(data&&data.length){isApplyingCloud=true;state.cards=data.map((r,i)=>ensureCardDefaults({id:r.id,name:r.name,rides:r.rides,color:r.color,presets:r.presets,log:r.log},i));localStorage.setItem(STORAGE_KEY,JSON.stringify(state));render();isApplyingCloud=false;}
 cloudReady=true;
 if(!data.length&&state.cards.length)await saveCardsToCloud();else syncStatus.textContent='Synchronisé';
}
async function performAuth(mode){
 if(!supabaseClient){authError.textContent='Supabase n’est pas configuré. Voir README.md.';return;}
 authSubmitBtn.disabled=true;authError.textContent='';
 try{
  const email=authEmail.value.trim(),password=authPassword.value;
  if(mode==='signup'){
   const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)throw error;
   if(data.session){localStorage.setItem('metroRememberLogin',String(rememberLogin.checked));closeAuth();await loadCardsFromCloud(data.user);}
   else authError.textContent='Vérifiez votre e-mail pour confirmer le compte, puis connectez-vous.';
  }else{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;
   localStorage.setItem('metroRememberLogin',String(rememberLogin.checked));closeAuth();await loadCardsFromCloud(data.user);
  }
 }catch(e){authError.textContent=e.message||'Une erreur est survenue.';}finally{authSubmitBtn.disabled=false;}
}
signInBtn.addEventListener('click',showAuth);
signOutBtn.addEventListener('click',async()=>{if(supabaseClient){await supabaseClient.auth.signOut();cloudUser=null;cloudReady=false;updateAccountUi();syncStatus.textContent='Déconnecté. Données locales conservées.';}});
document.getElementById('cancelAuthBtn').addEventListener('click',closeAuth);
authOverlay.addEventListener('click',e=>{if(e.target===authOverlay)closeAuth();});
createAccountBtn.addEventListener('click',()=>setAuthMode(true));
authForm.addEventListener('submit',e=>{e.preventDefault();performAuth(authSubmitBtn.dataset.mode||'signin');});
async function initializeCloud(){
 updateAccountUi();if(!supabaseClient)return;
 const {data:{session}}=await supabaseClient.auth.getSession();if(session)await loadCardsFromCloud(session.user);
 supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;cloudReady=false;updateAccountUi();}else if(session&&!cloudUser)queueMicrotask(()=>loadCardsFromCloud(session.user));});
}

const grid=document.getElementById('grid');
const menuBtn=document.getElementById('menuBtn');
const menuBadge=document.getElementById('menuBadge');
const menuOverlay=document.getElementById('menuOverlay');
const closeMenuBtn=document.getElementById('closeMenuBtn');
const themeToggle=document.getElementById('themeToggle');
const addCardBtn=document.getElementById('addCardBtn');
const manageCardsBtn=document.getElementById('manageCardsBtn');
const statsBtn=document.getElementById('statsBtn');
const exportBtn=document.getElementById('exportBtn');
const importBtn=document.getElementById('importBtn');
const importFile=document.getElementById('importFile');
const resetCardsBtn=document.getElementById('resetCardsBtn');
const manageModal=document.getElementById('manageModal');
const manageList=document.getElementById('manageList');
const statsModal=document.getElementById('statsModal');
const statsList=document.getElementById('statsList');
const editModal=document.getElementById('editModal');
const editNameInput=document.getElementById('editNameInput');
const editRidesInput=document.getElementById('editRidesInput');
const colorRow=document.getElementById('colorRow');
const preset1Input=document.getElementById('preset1Input');
const preset2Input=document.getElementById('preset2Input');
const preset3Input=document.getElementById('preset3Input');
const saveCardBtn=document.getElementById('saveCardBtn');
const deleteCardBtn=document.getElementById('deleteCardBtn');
const reloadModal=document.getElementById('reloadModal');
const reloadTitle=document.getElementById('reloadTitle');
const reloadCurrent=document.getElementById('reloadCurrent');
const chipRow=document.getElementById('chipRow');
const reloadInput=document.getElementById('reloadInput');
const replaceToggle=document.getElementById('replaceToggle');
const confirmReloadBtn=document.getElementById('confirmReloadBtn');
const cancelReloadBtn=document.getElementById('cancelReloadBtn');

let activeCardId=null;
let editSelectedColor=null;
let lastChangedId=null;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showOverlay(ov){ov.classList.add('active');}
function hideOverlay(ov){ov.classList.remove('active');}
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', e=>{ if(e.target===ov) hideOverlay(ov); });
});
document.querySelectorAll('.close-modal').forEach(btn=>{
  btn.addEventListener('click', e=> hideOverlay(e.target.closest('.overlay')));
});

function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-theme', state.theme);
  themeToggle.checked = state.theme==='dark';
}

function getUsage(card, days){
  const cutoff = Date.now() - days*86400000;
  return card.log.filter(e=>e.ts>=cutoff && e.delta<0).reduce((s,e)=>s+Math.abs(e.delta),0);
}

function render(){
  grid.innerHTML='';
  state.cards.forEach(c=> grid.appendChild(buildCardEl(c)));
  const anyLow = state.cards.some(c=>c.rides<=LOW_THRESHOLD);
  menuBadge.classList.toggle('show', anyLow);
}

function buildCardEl(card){
  const el=document.createElement('div');
  el.className='card'+(card.rides<=LOW_THRESHOLD?' low':'');
  el.style.setProperty('--card-color', card.color);
  el.dataset.id=card.id;
  const pulseClass = (card.id===lastChangedId) ? ' pulse' : '';
  el.innerHTML=`
    <div class="swipe-hint left">−1</div>
    <div class="swipe-hint right">+1</div>
    <div class="card-header">
      <span class="card-color-dot"></span>
      <span class="card-name">${escapeHtml(card.name)}</span>
      ${card.rides<=LOW_THRESHOLD?'<span class="warn-badge">⚠️</span>':''}
    </div>
    <div class="card-rides">
      <span class="rides-count${pulseClass}">${card.rides}</span>
      <span class="rides-label">${card.rides===1?'ticket restant':'tickets restants'}</span>
    </div>
    <div class="card-actions">
      <button data-action="minus" class="btn-minus">−</button>
      <button data-action="reload" class="btn-reload">⟳</button>
      <button data-action="plus" class="btn-plus">+</button>
    </div>`;
  el.querySelector('[data-action="minus"]').addEventListener('click', e=>{e.stopPropagation(); changeRides(card.id,-1);});
  el.querySelector('[data-action="plus"]').addEventListener('click', e=>{e.stopPropagation(); changeRides(card.id,1);});
  el.querySelector('[data-action="reload"]').addEventListener('click', e=>{e.stopPropagation(); openReloadModal(card.id);});

  // Long-press to edit + swipe gestures
  let startX=0, startY=0, dx=0, isSwiping=false, longPressTimer=null;
  const SWIPE_THRESHOLD=70;

  const onStart=(e)=>{
    if(e.target.closest('button')) return;
    const t = e.touches ? e.touches[0] : e;
    startX=t.clientX; startY=t.clientY; dx=0; isSwiping=false;
    longPressTimer=setTimeout(()=>{ if(!isSwiping) openEditModal(card.id); },550);
  };
  const onMove=(e)=>{
    if(e.target.closest('button') && !isSwiping) return;
    const t = e.touches ? e.touches[0] : e;
    const mdx=t.clientX-startX, mdy=t.clientY-startY;
    if(!isSwiping && Math.abs(mdx)>12 && Math.abs(mdx)>Math.abs(mdy)){
      isSwiping=true; clearTimeout(longPressTimer); el.classList.add('swiping');
    }
    if(isSwiping){
      dx=mdx;
      const clamped=Math.max(-120,Math.min(120,dx));
      el.style.transform=`translateX(${clamped}px)`;
      if(e.cancelable) e.preventDefault();
    }
  };
  const onEnd=()=>{
    clearTimeout(longPressTimer);
    el.classList.remove('swiping');
    if(isSwiping){
      if(dx<=-SWIPE_THRESHOLD){
        el.style.transform='translateX(-140px)';
        setTimeout(()=>changeRides(card.id,-1),120);
      } else if(dx>=SWIPE_THRESHOLD){
        el.style.transform='translateX(140px)';
        setTimeout(()=>changeRides(card.id,1),120);
      } else {
        el.style.transform='';
      }
    }
    isSwiping=false; dx=0;
  };
  el.addEventListener('touchstart', onStart, {passive:true});
  el.addEventListener('touchmove', onMove, {passive:false});
  el.addEventListener('touchend', onEnd);
  el.addEventListener('touchcancel', onEnd);
  el.addEventListener('mousedown', onStart);
  el.addEventListener('mouseup', onEnd);
  el.addEventListener('mouseleave', onEnd);

  return el;
}

function changeRides(id, delta){
  const card=state.cards.find(c=>c.id===id); if(!card) return;
  const before=card.rides;
  card.rides=Math.max(0, Math.min(999, card.rides+delta));
  const actualDelta = card.rides - before;
  if(actualDelta!==0){
    card.log.push({ts:Date.now(), delta:actualDelta});
    if(card.log.length>500) card.log=card.log.slice(-500);
  }
  hapticTap();
  lastChangedId=id;
  saveState(); render();
}

function openReloadModal(id){
  activeCardId=id;
  const card=state.cards.find(c=>c.id===id);
  reloadTitle.textContent=`Recharger — ${card.name}`;
  reloadCurrent.textContent=`Solde actuel : ${card.rides} ${card.rides===1?'ticket':'tickets'}`;
  chipRow.innerHTML='';
  card.presets.forEach(val=>{
    const btn=document.createElement('button');
    btn.className='chip'; btn.textContent=`+${val}`; btn.dataset.value=val;
    btn.addEventListener('click', ()=> reloadInput.value=val);
    chipRow.appendChild(btn);
  });
  reloadInput.value=card.presets[0]||10; replaceToggle.checked=false;
  showOverlay(reloadModal);
}
confirmReloadBtn.addEventListener('click', ()=>{
  const card=state.cards.find(c=>c.id===activeCardId); if(!card) return;
  const val=parseInt(reloadInput.value,10)||0;
  const before=card.rides;
  card.rides = replaceToggle.checked ? Math.max(0,val) : Math.max(0, card.rides+val);
  const actualDelta = card.rides-before;
  if(actualDelta!==0){
    card.log.push({ts:Date.now(), delta:actualDelta});
    if(card.log.length>500) card.log=card.log.slice(-500);
  }
  hapticTap();
  lastChangedId=card.id;
  saveState(); render(); hideOverlay(reloadModal);
});
cancelReloadBtn.addEventListener('click', ()=> hideOverlay(reloadModal));

function renderColorSwatches(){
  colorRow.innerHTML='';
  CARD_COLORS.forEach(color=>{
    const sw=document.createElement('div');
    sw.className='color-swatch'+(color===editSelectedColor?' selected':'');
    sw.style.background=color;
    sw.addEventListener('click', ()=>{ editSelectedColor=color; renderColorSwatches(); });
    colorRow.appendChild(sw);
  });
}

function openEditModal(id){
  activeCardId=id;
  const card=state.cards.find(c=>c.id===id); if(!card) return;
  editNameInput.value=card.name; editRidesInput.value=card.rides;
  editSelectedColor=card.color;
  preset1Input.value=card.presets[0];
  preset2Input.value=card.presets[1];
  preset3Input.value=card.presets[2];
  renderColorSwatches();
  showOverlay(editModal);
}
saveCardBtn.addEventListener('click', ()=>{
  const card=state.cards.find(c=>c.id===activeCardId); if(!card) return;
  const name=editNameInput.value.trim(); if(name) card.name=name;
  const rides=parseInt(editRidesInput.value,10);
  if(!isNaN(rides)) card.rides=Math.max(0,rides);
  if(editSelectedColor) card.color=editSelectedColor;
  const p1=parseInt(preset1Input.value,10)||10;
  const p2=parseInt(preset2Input.value,10)||20;
  const p3=parseInt(preset3Input.value,10)||30;
  card.presets=[p1,p2,p3];
  saveState(); render(); hideOverlay(editModal);
});
deleteCardBtn.addEventListener('click', ()=>{
  if(confirm('Supprimer cette carte ?')){
    state.cards=state.cards.filter(c=>c.id!==activeCardId);
    saveState(); render(); hideOverlay(editModal);
  }
});

function addCard(){
  const card=ensureCardDefaults({id:uid(), name:'Nouvelle carte', rides:0}, state.cards.length);
  state.cards.push(card); saveState(); render();
  openEditModal(card.id);
}
addCardBtn.addEventListener('click', ()=>{ hideOverlay(menuOverlay); addCard(); });

manageCardsBtn.addEventListener('click', ()=>{ hideOverlay(menuOverlay); renderManageList(); showOverlay(manageModal); });
function renderManageList(){
  manageList.innerHTML='';
  if(state.cards.length===0){ manageList.innerHTML='<p>Aucune carte. Ajoutez-en une !</p>'; return; }
  state.cards.forEach(card=>{
    const row=document.createElement('div');
    row.className='manage-row';
    row.innerHTML=`<span>${escapeHtml(card.name)} — ${card.rides} tickets</span>
      <span class="manage-actions">
        <button data-action="edit" data-id="${card.id}">✎</button>
        <button data-action="delete" data-id="${card.id}">🗑</button>
      </span>`;
    manageList.appendChild(row);
  });
}
manageList.addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  const id=btn.dataset.id;
  if(btn.dataset.action==='edit'){ hideOverlay(manageModal); openEditModal(id); }
  if(btn.dataset.action==='delete'){
    if(confirm('Supprimer cette carte ?')){
      state.cards=state.cards.filter(c=>c.id!==id);
      saveState(); render(); renderManageList();
    }
  }
});

statsBtn.addEventListener('click', ()=>{
  hideOverlay(menuOverlay);
  statsList.innerHTML='';
  if(state.cards.length===0){ statsList.innerHTML='<p>Aucune carte.</p>'; }
  state.cards.forEach(card=>{
    const used7=getUsage(card,7);
    const used30=getUsage(card,30);
    const row=document.createElement('div');
    row.className='stats-row';
    row.innerHTML=`<span class="name">${escapeHtml(card.name)}</span><span>7j: ${used7} · 30j: ${used30}</span>`;
    statsList.appendChild(row);
  });
  showOverlay(statsModal);
});

exportBtn.addEventListener('click', ()=>{
  hideOverlay(menuOverlay);
  const dataStr=JSON.stringify(state, null, 2);
  const blob=new Blob([dataStr], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`metro-cards-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

importBtn.addEventListener('click', ()=>{ hideOverlay(menuOverlay); importFile.click(); });
importFile.addEventListener('change', (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(parsed && Array.isArray(parsed.cards)){
        if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){
          parsed.cards = parsed.cards.map((c,i)=>ensureCardDefaults(c,i));
          state = parsed;
          saveState(); applyTheme(); render();
        }
      } else {
        alert('Fichier invalide.');
      }
    }catch(err){ alert('Erreur de lecture du fichier.'); }
    importFile.value='';
  };
  reader.readAsText(file);
});

resetCardsBtn.addEventListener('click', ()=>{
  hideOverlay(menuOverlay);
  if(confirm('Réinitialiser aux 4 cartes par défaut ? Action irréversible.')){
    state.cards=DEFAULT_CARDS(); saveState(); render();
  }
});

themeToggle.addEventListener('change', ()=>{
  state.theme = themeToggle.checked ? 'dark':'light';
  saveState(); applyTheme();
});

menuBtn.addEventListener('click', ()=> showOverlay(menuOverlay));
closeMenuBtn.addEventListener('click', ()=> hideOverlay(menuOverlay));

applyTheme();
render();
initializeCloud();
</script>
</body>
</html>
